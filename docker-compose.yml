services:
  kafka:
    image: confluentinc/cp-kafka:8.1.6
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.6
    hostname: schema-registry
    ports:
      - "127.0.0.1:${SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: "schema-registry"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:29092"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx256m"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:8.1.6
    entrypoint: ["kafka-topics"]
    command:
      - --bootstrap-server
      - kafka:29092
      - --create
      - --if-not-exists
      - --topic
      - movie-events
      - --partitions
      - "3"
      - --replication-factor
      - "1"
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  schema-init:
    build:
      context: ./schema-init
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        jq --null-input --rawfile schema /schemas/movie-event.proto \
          '{schemaType: "PROTOBUF", schema: $$schema}' > /tmp/schema.json
        curl -fsS --max-time 30 \
          -H 'Content-Type: application/vnd.schemaregistry.v1+json' \
          --data-binary @/tmp/schema.json \
          --output /tmp/registered-schema.json \
          'http://schema-registry:8081/subjects/movie-events-value/versions?normalize=true'
        id=$$(jq -er '.id' /tmp/registered-schema.json)
        curl -fsS --max-time 30 \
          --output /format-schemas/movie-event.proto.tmp \
          "http://schema-registry:8081/schemas/ids/$$id/schema"
        mv /format-schemas/movie-event.proto.tmp /format-schemas/movie-event.proto
        jq '{id, version}' /tmp/registered-schema.json
    volumes:
      - ./schemas:/schemas:ro
      - clickhouse-schemas:/format-schemas
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    restart: "no"

  movie-service:
    build:
      context: .
      dockerfile: movie-service/Dockerfile
    ports:
      - "127.0.0.1:${MOVIE_HTTP_PORT:-8080}:8080"
    environment:
      MOVIE_HTTP_ADDR: ":8080"
      MOVIE_KAFKA_BROKERS: "kafka:29092"
      MOVIE_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      MOVIE_GENERATOR_ENABLED: "${MOVIE_GENERATOR_ENABLED:-false}"
    depends_on:
      schema-init:
        condition: service_completed_successfully
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.46.6
    environment:
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "1"
      AGGREGATION_CLICKHOUSE_PASSWORD: "${AGGREGATION_CLICKHOUSE_PASSWORD:-cinema-local-clickhouse}"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-schemas:/var/lib/clickhouse/format_schemas
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/users.d/aggregation.xml:/etc/clickhouse-server/users.d/aggregation.xml:ro
    depends_on:
      schema-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "-T", "5", "http://clickhouse:8123/ping"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:17.12-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cinema-local-postgres}"
      POSTGRES_DB: "${AGGREGATION_POSTGRES_DB:-cinema}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  postgres-migrate:
    image: postgres:17.12-alpine3.24
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for migration in /migrations/*.sql; do
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --single-transaction --file "$$migration"
        done
    environment:
      PGHOST: postgres
      PGDATABASE: "${AGGREGATION_POSTGRES_DB:-cinema}"
      PGUSER: postgres
      PGPASSWORD: "${POSTGRES_PASSWORD:-cinema-local-postgres}"
      PGCONNECT_TIMEOUT: "5"
      AGGREGATION_POSTGRES_PASSWORD: "${AGGREGATION_POSTGRES_PASSWORD:-cinema-local-aggregation}"
    volumes:
      - ./postgres/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  aggregation-service:
    build:
      context: .
      dockerfile: aggregation-service/Dockerfile
    ports:
      - "127.0.0.1:${AGGREGATION_HTTP_PORT:-8082}:8082"
    environment:
      AGGREGATION_INTERVAL: "${AGGREGATION_INTERVAL:-}"
      AGGREGATION_CLICKHOUSE_ADDR: "clickhouse:9000"
      AGGREGATION_CLICKHOUSE_USER: aggregation
      AGGREGATION_CLICKHOUSE_PASSWORD: "${AGGREGATION_CLICKHOUSE_PASSWORD:-cinema-local-clickhouse}"
      AGGREGATION_POSTGRES_HOST: postgres
      AGGREGATION_POSTGRES_PORT: "5432"
      AGGREGATION_POSTGRES_USER: aggregation
      AGGREGATION_POSTGRES_PASSWORD: "${AGGREGATION_POSTGRES_PASSWORD:-cinema-local-aggregation}"
      AGGREGATION_POSTGRES_DB: "${AGGREGATION_POSTGRES_DB:-cinema}"
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka-data:
  clickhouse-data:
  clickhouse-schemas:
  postgres-data:
